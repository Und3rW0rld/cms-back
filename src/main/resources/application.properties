# =============================================================
# BASE CONFIGURATION — shared across all profiles
# Profile-specific overrides live in application-{profile}.properties
#
# Active profile is set by Maven:
#   mvn spring-boot:run  -> dev  (configured in spring-boot-maven-plugin)
#   mvn test             -> test (forced by maven-surefire-plugin)
#   production deploy    -> prod (set via SPRING_PROFILES_ACTIVE env var)
# =============================================================

spring.application.name=cms-back

server.port=8080
server.servlet.context-path=/api

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.expiration=86400000
jwt.refresh-expiration=604800000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
