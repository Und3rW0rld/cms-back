# =============================================================
# BASE CONFIGURATION — shared across all profiles
# Profile-specific overrides live in application-{profile}.properties
#
# Active profile is set by Maven:
#   mvn spring-boot:run  -> dev  (configured in spring-boot-maven-plugin)
#   mvn test             -> test (forced by maven-surefire-plugin)
#   production deploy    -> prod (set via SPRING_PROFILES_ACTIVE env var)
# =============================================================

spring.application.name=cms-back

server.port=8080
server.servlet.context-path=/api
# Suppress Tomcat Server header to avoid leaking server version
server.server-header=

spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Ensures Flyway runs before Hibernate validates the schema (Spring Boot 4)
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
# Disable open-in-view — keeps DB connections open during HTTP response rendering.
# Not needed in a stateless REST API.
spring.jpa.open-in-view=false

jwt.expiration=86400000
jwt.refresh-expiration=604800000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ==================== Actuator ====================
# Runs on a separate port — never exposed on the API port (8080)
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

info.app.name=${spring.application.name}
info.app.version=@project.version@
