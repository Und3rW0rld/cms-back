# =============================================================
# BASE CONFIGURATION — shared across all profiles
# Profile-specific overrides live in application-{profile}.properties
#
# Active profile is set by Maven:
#   mvn spring-boot:run  -> dev  (configured in spring-boot-maven-plugin)
#   mvn test             -> test (forced by maven-surefire-plugin)
#   production deploy    -> prod (set via SPRING_PROFILES_ACTIVE env var)
# =============================================================

spring.application.name=cms-back

server.port=8080
server.servlet.context-path=/api
server.server-header=

# ==================== Request limits ====================
# Note: These properties limit multipart uploads (max-file-size, max-request-size) and 
# application/x-www-form-urlencoded form posts (max-http-form-post-size) at Tomcat level.
# JSON request bodies (e.g., draft content) are NOT limited by these properties.
# Domain-level validation via ContentSizeValidator enforces the 1MB content limit in use cases.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-http-form-post-size=2MB

# ==================== Tomcat timeouts ====================
# How long Tomcat waits for a client to complete the HTTP request headers (5s)
server.connection-timeout=5000
# How long to keep an idle keep-alive connection open (20s)
server.tomcat.keep-alive-timeout=20000

spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Ensures Flyway runs before Hibernate validates the schema (Spring Boot 4)
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
# Disable open-in-view — keeps DB connections open during HTTP response rendering.
# Not needed in a stateless REST API.
spring.jpa.open-in-view=false

jwt.expiration=86400000
jwt.refresh-expiration=604800000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ==================== Actuator ====================
# Runs on a separate port — never exposed on the API port (8080)
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

info.app.name=${spring.application.name}
info.app.version=@project.version@
