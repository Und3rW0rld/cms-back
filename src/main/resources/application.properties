spring.application.name=cms-back

# ==================== PostgreSQL ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/cms_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== Flyway ====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==================== Server ====================
server.port=8080
server.servlet.context-path=/api

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-in-production-at-least-32-chars}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==================== Swagger / OpenAPI ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ==================== Logging ====================
logging.level.com.cms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
