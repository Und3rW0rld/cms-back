# =============================================================
# DEV PROFILE
# Activated automatically by spring-boot-maven-plugin when running:
#   mvn spring-boot:run
# =============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/cms_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway manages the schema. Hibernate only validates it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

# Verbose in dev — see all app logs and SQL queries
logging.level.com.cms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
