# =============================================================
# DEV PROFILE
# Activated automatically by spring-boot-maven-plugin when running:
#   mvn spring-boot:run
#
# Credentials come from environment variables defined in .env
# (never committed — see .gitignore)
# =============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway manages the schema. Hibernate validates it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Insecure default intentional for local dev only — never use in production
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-in-production-at-least-32-chars}

# Verbose in dev — see all app logs and SQL queries
logging.level.com.cms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
