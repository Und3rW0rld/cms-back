# =============================================================
# PROD PROFILE
# Activated via environment variable: SPRING_PROFILES_ACTIVE=prod
#
# Key differences from dev:
#   - All credentials from env vars — no defaults allowed
#   - No SQL logging
#   - Strict ddl-auto: none — Flyway owns schema, Hibernate touches nothing
#   - Minimal logging — INFO only
#   - Swagger UI disabled
# =============================================================

# All credentials MUST come from environment variables — no fallback defaults
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# none: Hibernate will not attempt any DDL — Flyway is the only schema manager
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true

# Disabled in production — API docs should not be publicly accessible
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.com.cms=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate=WARN
