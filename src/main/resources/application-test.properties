# =============================================================
# TEST PROFILE
# Activated automatically by maven-surefire-plugin for ALL mvn test runs.
# Also applied via @ActiveProfiles("test") on individual test classes.
#
# Key differences from dev:
#   - Separate DB (cms_db_test) — never touches cms_db
#   - Flyway disabled — Hibernate creates/drops schema per test run
#   - ddl-auto: create-drop — schema is built from entities, destroyed after
#   - Minimal logging — keeps test output readable
# =============================================================

# Separate DB — tests never touch the dev database
spring.datasource.url=jdbc:postgresql://localhost:5432/cms_db_test
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate owns schema in tests — creates on startup, drops on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disabled — ddl-auto handles schema, Flyway would conflict
spring.flyway.enabled=false

# Minimal — tests should be readable, not flooded with logs
logging.level.com.cms=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
